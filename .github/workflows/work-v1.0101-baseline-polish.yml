name: NOSMO Work V1.0101 Baseline Polish

on:
  push:
    branches:
      - codex/work-v1.0101-migration
    paths:
      - .github/workflows/work-v1.0101-baseline-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Align canonical copy with V1.0101 baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/work/screen.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('<section class="agentBox"><h2>NOSMO CONSTRUCTION JOBS</h2>', '<section class="agentBox"><h2>NOSMO WORK AGENT</h2>')
          text=text.replace('Work Mode V2 runs only in the fourth window and does not scan from Work Card.', 'Work Mode is available from Apps and does not scan the device or Work Card automatically.')
          p.write_text(text,encoding='utf-8')
          assert 'NOSMO WORK AGENT' in text
          assert 'fourth window' not in text
          PY

      - name: Commit baseline copy alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/work/screen.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'work: align Jobs and Work Mode copy with V1.0101'
            git push origin HEAD:codex/work-v1.0101-migration
          fi
