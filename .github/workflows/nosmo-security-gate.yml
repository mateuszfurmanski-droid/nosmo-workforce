name: NOSMO Security Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/agency/runtime/**
      - apps/work/**
      - SECURITY_GATE.md
      - .env.example
      - .gitignore
      - .github/workflows/nosmo-security-gate.yml
  push:
    branches:
      - main
    paths:
      - apps/agency/runtime/**
      - apps/work/**
      - SECURITY_GATE.md
      - .env.example
      - .gitignore
      - .github/workflows/nosmo-security-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-static-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agency/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/agency/runtime/package.json
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Existing functional contracts plus security QA
        run: npm run check
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
