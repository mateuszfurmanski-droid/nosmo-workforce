name: TMP NOSMO Work V1.0102 Title Fix

on:
  push:
    branches:
      - tmp/work-v1.0102-finalise-patch
    paths:
      - .github/workflows/tmp-work-v1.0102-title-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/work/js/work-v10101-shell.js')
          s=p.read_text(encoding='utf-8')
          old='''  function init(){\n    document.title="NOSMO Work";'''
          new='''  function init(){\n    if(location.pathname.endsWith("/index.html")||location.pathname.endsWith("/"))document.title="NOSMO Work";'''
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/work/js/work-v10101-shell.js
          git commit -m 'fix(work): preserve per-screen titles in V1.0102'
          git push origin HEAD:tmp/work-v1.0102-finalise-patch
