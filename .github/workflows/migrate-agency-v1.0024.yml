name: Migrate NOSMO Agency V1.0024 source

on:
  push:
    branches:
      - migration/agency-v1.0024
    paths:
      - .github/workflows/migrate-agency-v1.0024.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/migrate-agency-v1.0024.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-agency-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Preserve exact Agency V1.0024 source
        shell: bash
        run: |
          set -euo pipefail
          SRC_REPO="mateuszfurmanski-droid/nosmo-nexus-mvp"
          SRC_COMMIT="2d9110354e6084a3f5922e0acafc9f9a31ad1934"
          RAW="https://raw.githubusercontent.com/${SRC_REPO}/${SRC_COMMIT}"
          ROOT="apps/agency/legacy/v1.0024"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          copy_exact() {
            src="$1"
            dst="$2"
            expected="$3"
            mkdir -p "$(dirname "$dst")"
            curl --fail --location --retry 3 --silent --show-error "$RAW/$src" -o "$dst"
            actual="$(git hash-object "$dst")"
            if [ "$actual" != "$expected" ]; then
              echo "SHA_MISMATCH $src expected=$expected actual=$actual" >&2
              exit 1
            fi
            printf '%s\t%s\t%s\n' "$expected" "$src" "$dst" >> /tmp/agency-source-manifest.tsv
          }

          : > /tmp/agency-source-manifest.tsv

          # Agency recruiter frontend only. Worker Person Card / Work Mode are deliberately excluded.
          copy_exact "modules/person-card-freeware/agency-desk.html" "$ROOT/frontend/agency-desk.html" "cba68739ef840267a928ea652e2b259953556bea"
          copy_exact "modules/person-card-freeware/agency-invite.html" "$ROOT/frontend/agency-invite.html" "a3774c666bd57ab08d36e3ef329dca13314a0074"
          copy_exact "modules/person-card-freeware/directory.html" "$ROOT/frontend/directory.html" "4e66f6d972f5787b51bd596f0a6d8001cf8b3aa6"
          copy_exact "modules/person-card-freeware/css/asia-hub-theme.css" "$ROOT/frontend/css/asia-hub-theme.css" "0b6ab99646a81a82e3b805d1995dcdd17dd31879"
          copy_exact "modules/person-card-freeware/js/agency-desk.js" "$ROOT/frontend/js/agency-desk.js" "d2ed2b6329376f36795d695fff566ccc2ea4659a"
          copy_exact "modules/person-card-freeware/js/person-agency-invite.js" "$ROOT/frontend/js/person-agency-invite.js" "fd1c61b0cc532efda8fdd415a5fd2af44f081c67"
          copy_exact "modules/person-card-freeware/js/contact-action-engine.js" "$ROOT/frontend/js/contact-action-engine.js" "a3b1f8612ccb2aebb93ec721b144bb4e4cb953f6"
          copy_exact "modules/person-card-freeware/js/canonical-work-profile-bridge.js" "$ROOT/frontend/js/canonical-work-profile-bridge.js" "86718aab76b89a1e38940efc387216621f076b2c"
          copy_exact "modules/person-card-freeware/data-fetcher/index.html" "$ROOT/frontend/import/index.html" "2de125c9caf4c7eb974e13be36cd3817f0583573"
          copy_exact "modules/person-card-freeware/data-fetcher/app.js" "$ROOT/frontend/import/app.js" "3159b23e84388f6fe5a728b473d9ae139dd2e0cc"
          copy_exact "modules/person-card-freeware/data-fetcher/styles.css" "$ROOT/frontend/import/styles.css" "13d9c5731cae3c53d6836aa6c2e8d06e0163a1a8"
          copy_exact "modules/person-card-freeware/source-manifest.json" "$ROOT/provenance/original-source-manifest.json" "76ea7a6814f3116b04a96e0d8c4fb58d41e1fe55"

          # Agency API and matching source.
          copy_exact "artifacts/api-server/src/person-card-freeware/agency.ts" "$ROOT/backend/agency.ts" "bfa6ee485a4205006d72776e946a3043df0088ae"
          copy_exact "artifacts/api-server/src/person-card-freeware/agency-v1-finalisation.ts" "$ROOT/backend/agency-v1-finalisation.ts" "4d3a6354aa28972711a2529cffc97b28154a14f4"
          copy_exact "artifacts/api-server/src/person-card-freeware.ts" "$ROOT/backend/standalone-host.ts" "8657277ab87adb43b66a7d70f8461dc989ab8b86"
          copy_exact "artifacts/api-server/src/person-card-freeware/job-object.ts" "$ROOT/backend/matching/job-object.ts" "841704e93a7fb625ba5e26f4341d7355e3cfe0c3"
          copy_exact "artifacts/api-server/src/person-card-freeware/job-ai-match.ts" "$ROOT/backend/matching/job-ai-match.ts" "b54b332772679d21389eb19106074daf1585bfa7"
          copy_exact "artifacts/api-server/src/person-card-freeware/job-search.ts" "$ROOT/backend/matching/job-search.ts" "caad3a730c4b1da4a219ff10203842817386d0d2"
          copy_exact "artifacts/api-server/src/person-card-freeware/job-adzuna.ts" "$ROOT/backend/matching/job-adzuna.ts" "14734ba3cb66c38230bfbb71826bf55f82df1bbb"

          # Worker-consent server contracts required by Agency, preserved as contracts, not Worker UI.
          copy_exact "artifacts/api-server/src/person-card-freeware/onboarding-invite.ts" "$ROOT/contracts/worker-consent/onboarding-invite.ts" "e5c92fe93d680e70d5b2adda23b22f292e8a3656"
          copy_exact "artifacts/api-server/src/person-card-freeware/onboarding.ts" "$ROOT/contracts/worker-consent/onboarding.ts" "7bf85701274c59edd2a380a0500830d2866ebcb4"
          copy_exact "artifacts/api-server/src/person-card-freeware/person-work-profile-persistence.ts" "$ROOT/contracts/worker-consent/person-work-profile-persistence.ts" "c12de944c2b8ee2e5f64924a5fd932d8582ecfd8"

          # Canonical persistence definitions used by the Agency source.
          copy_exact "lib/db/src/schema/nexusPerson.ts" "$ROOT/backend/schema/nexusPerson.ts" "4b0c6fdc7894470418107915ab4e4650f1b0e4aa"
          copy_exact "lib/db/src/schema/nexusPersonAgency.ts" "$ROOT/backend/schema/nexusPersonAgency.ts" "f6e7dc1f2b44f7e9e1be69a5294f5c5828aea6ea"
          copy_exact "lib/db/src/schema/nexusPersonWorkProfile.ts" "$ROOT/backend/schema/nexusPersonWorkProfile.ts" "6b61c252d50fd763567e800cbe01f96fb9c0516e"

          # Reproducible database and QA contracts.
          copy_exact "artifacts/api-server/src/person-card-freeware/sql/001-person-card-agency-persistence.sql" "$ROOT/database/001-person-card-agency-persistence.sql" "016167ee3f5052a0f28723faee7cd3939b6fd44e"
          copy_exact "artifacts/api-server/src/person-card-freeware/sql/002-agency-v1-roster-pipeline.sql" "$ROOT/database/002-agency-v1-roster-pipeline.sql" "f0453d70866abc6e4994feab5c4a3070ee1a08f4"
          copy_exact "artifacts/api-server/src/person-card-freeware/sql/verify-person-card-agency-e2e.sql" "$ROOT/tests/verify-person-card-agency-e2e.sql" "d246e27f5fa206573371929b6276e6e420cd26ad"
          copy_exact "modules/person-card-freeware/tests/agency-ui-api-e2e-setup.sql" "$ROOT/tests/agency-ui-api-e2e-setup.sql" "5ef0daf5b0b76f2f40bc2de02c482a367228b1a7"
          copy_exact "modules/person-card-freeware/tests/agency-ui-api-e2e.cjs" "$ROOT/tests/agency-ui-api-e2e.cjs" "679fee1ec37d7e8ffee7a15b94c4238297afea2a"
          copy_exact "modules/person-card-freeware/tests/agency-v1-api-e2e-fixture.sql" "$ROOT/tests/agency-v1-api-e2e-fixture.sql" "788918b2ddee441ace639ea3cc625f8efacda988"
          copy_exact "modules/person-card-freeware/tests/agency-v1-api-e2e.cjs" "$ROOT/tests/agency-v1-api-e2e.cjs" "f53272ff7767caa07d1a21f19d31b56ba8f2004a"

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/agency-source-manifest.tsv').read_text().splitlines():
              sha,src,dst=line.split('\t')
              rows.append({'blobSha':sha,'sourcePath':src,'targetPath':dst})
          manifest={
              'schema':'nosmo-agency-source-preservation/v1',
              'product':'NOSMO Agency',
              'baseline':'V1.0024',
              'sourceRepository':'mateuszfurmanski-droid/nosmo-nexus-mvp',
              'sourceCommit':'2d9110354e6084a3f5922e0acafc9f9a31ad1934',
              'targetRepository':'mateuszfurmanski-droid/nosmo-workforce',
              'workerFrontendCopied':False,
              'nexusCoreCopied':False,
              'files':rows,
          }
          p=Path('apps/agency/legacy/v1.0024/SOURCE_MANIFEST.json')
          p.write_text(json.dumps(manifest,indent=2)+'\n')
          PY

          cat > "$ROOT/README.md" <<'EOF'
          # NOSMO Agency V1.0024 preserved source

          This directory is a bit-for-bit preservation snapshot from the previous repository. It is migration evidence, not the canonical V1.0025 implementation.

          Important boundaries:
          - Worker Person Card, Work Card and Work Mode frontend files are intentionally not copied here.
          - Nexus Core / e-SAFE implementation is intentionally not copied here.
          - Worker-consent server files are retained only because Agency visibility depends on those contracts.
          - The old frontend contains historical platform/login assumptions and links back to Worker routes. Do not treat those as the final auth or navigation architecture.
          - Current ChatGPT Sites UI may be newer than this preserved source; parity/reconciliation must be done before canonical V1.0025 changes.
          EOF

          # This workflow is Agency-only. Fail if anything under apps/work changed.
          if git status --porcelain -- apps/work | grep -q .; then
            echo "WORK_APP_CHANGED_DURING_AGENCY_MIGRATION" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/agency/legacy/v1.0024
          if git diff --cached --quiet; then
            echo "Agency source already preserved."
            exit 0
          fi
          git commit -m "migrate(agency): preserve V1.0024 source pack"
          git push origin "HEAD:${TARGET_BRANCH}"
