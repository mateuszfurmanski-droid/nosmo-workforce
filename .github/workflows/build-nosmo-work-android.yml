name: Build NOSMO Work Android APK

on:
  push:
    branches:
      - main
    paths:
      - apps/work/android-app/**
      - apps/work/tests/android-share-target.test.mjs
      - .github/workflows/build-nosmo-work-android.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/work/android-app/**
      - apps/work/tests/android-share-target.test.mjs
      - .github/workflows/build-nosmo-work-android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nosmo-work-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run native source checks
        working-directory: apps/work
        run: node --experimental-strip-types --test tests/android-share-target.test.mjs

      - name: Build and test Android app
        working-directory: apps/work/android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nosmo-work-v1.0104-debug-apk
          path: apps/work/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
