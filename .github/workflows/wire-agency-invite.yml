name: Wire NOSMO Agency invite handoff

on:
  push:
    branches:
      - fix/agency-v1.0025-invite-consent
    paths:
      - '.github/workflows/wire-agency-invite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agency-v1.0025-invite-consent
      - name: Patch Agency invite endpoint and UI entrypoint
        shell: python
        env:
          INVITE_ROUTE_B64: 
        run: |
          import os, base64
          from pathlib import Path

          server = Path('apps/agency/server.js')
          text = server.read_text()
          marker = 'app.get("/styles.css",(_req,res)=>res.sendFile(path.join(__dirname,"styles.css")));'
          route = base64.b64decode(os.environ['INVITE_ROUTE_B64']).decode()
          if '/api/person-card/agency/v1/invites"' not in text:
              if marker not in text: raise SystemExit('server marker missing')
              server.write_text(text.replace(marker, route + marker))

          index = Path('apps/agency/index.html')
          html = index.read_text()
          hook = '  <script type="module" src="./enhancements.js"></script>'
          invite = '  <script type="module" src="./invite-ui.js"></script>'
          if invite not in html:
              if hook not in html: raise SystemExit('index hook missing')
              index.write_text(html.replace(hook, hook + '\n' + invite))

          smoke = Path('apps/agency/tests/static-smoke.mjs')
          s = smoke.read_text()
          old = "'/api/person-card/agency/v1/roster','/api/person-card/agency/v1/roster/import',"
          new = "'/api/person-card/agency/v1/roster','/api/person-card/agency/v1/roster/import','/api/person-card/agency/v1/invites',"
          if old in s and '/api/person-card/agency/v1/invites' not in s: s=s.replace(old,new)
          if 'Invite must never auto-grant consent' not in s:
              s += "\nassert.match(server,/consentGranted:false/,'Invite must never auto-grant consent');\nassert.match(server,/recruiterSafeAccessGranted:false/,'Invite must never auto-grant recruiter-safe access');\nassert.match(server,/WORK_APP_BASE_URL_REQUIRED/,'Invite must fail closed when Worker App URL is not configured');\nassert.match(html,/invite-ui\\.js/,'Invite UI module must be loaded');\n"
          smoke.write_text(s)

          workflow = Path('.github/workflows/agency-v1-static.yml')
          w = workflow.read_text()
          needle = '          node --check apps/agency/enhancements.js\n'
          if 'node --check apps/agency/invite-ui.js' not in w:
              if needle not in w: raise SystemExit('workflow syntax hook missing')
              workflow.write_text(w.replace(needle, needle + '          node --check apps/agency/invite-ui.js\n'))
      - name: Commit wired invite handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/agency/server.js apps/agency/index.html apps/agency/tests/static-smoke.mjs .github/workflows/agency-v1-static.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(agency): wire signed Worker App invite handoff"
          git push origin HEAD:fix/agency-v1.0025-invite-consent
