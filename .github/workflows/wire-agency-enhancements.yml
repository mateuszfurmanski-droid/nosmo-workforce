name: Wire NOSMO Agency V1.0025 enhancements

on:
  push:
    branches:
      - fix/agency-v1.0025-core
    paths:
      - '.github/workflows/wire-agency-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agency-v1.0025-core
      - name: Add enhancement module to Agency shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/agency/index.html')
          text=p.read_text()
          tag='  <script type="module" src="./enhancements.js"></script>\n'
          if tag not in text:
              marker='  <script type="module" src="./app.js"></script>\n'
              if marker not in text:
                  raise SystemExit('APP_SCRIPT_MARKER_NOT_FOUND')
              text=text.replace(marker,marker+tag)
              p.write_text(text)
          PY
          if git status --porcelain -- apps/work | grep -q .; then
            echo 'WORK_APP_CHANGED_DURING_AGENCY_WIRING' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/agency/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(agency): wire roster import and match generation UI'
          git push origin HEAD:fix/agency-v1.0025-core
