name: TMP NOSMO Work V1.0102 Fresh State QA

on:
  push:
    branches:
      - tmp/work-v1.0102-fresh-state
    paths:
      - .github/workflows/tmp-work-v1.0102-fresh-state-qa.yml
      - apps/work/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start Work server
        shell: bash
        run: |
          python -m http.server 4173 --directory apps/work >/tmp/work-fresh-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/work-fresh-http.log
          exit 1
      - name: Install selenium
        run: python -m pip install --quiet selenium
      - name: Run fresh-install acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base='http://localhost:4173/'
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,15)
          try:
            d.get(base+'index.html')
            w.until(lambda x: x.execute_script("return document.readyState")=='complete')
            d.execute_script('''
              [
                'nosmo-work:documents/v1','nosmo-work:work-card/v2','nosmo-work:work-card/v1',
                'nosmo-work:jobs/v1','nosmo-work:applications/v1','nosmo-work:employers/v1',
                'nosmo-work:demo/v1','nexus-person-work-profile-local:local-worker'
              ].forEach(k=>localStorage.removeItem(k));
            ''')

            d.get(base+'screen.html?screen=documents')
            w.until(lambda x: not x.find_element(By.ID,'documentsScreen').get_attribute('hidden'))
            w.until(lambda x: x.execute_script("return typeof allDocuments==='function'"))
            assert d.execute_script('return allDocuments().length')==0
            assert len(d.find_elements(By.CSS_SELECTOR,'#documentGroups .doc'))==0
            counts=d.execute_script("return ['countValid','countExpiring','countExpired','countNoExpiry'].map(id=>document.getElementById(id).textContent)")
            assert counts==['0','0','0','0'],counts
            page=d.find_element(By.ID,'documentsScreen').text
            assert 'CSCS / trade card placeholder' not in page
            assert 'Current Work Profile CV' not in page

            d.execute_script("localStorage.setItem('nosmo-work:documents/v1',JSON.stringify([{id:'expired-test',name:'Expired test',type:'cards',expiry:'2026-09-01',source:'local'}]))")
            d.refresh();w.until(lambda x: not x.find_element(By.ID,'documentsScreen').get_attribute('hidden'))
            status=w.until(lambda x: x.find_element(By.CSS_SELECTOR,'#documentGroups .doc .status')).text
            assert status=='EXPIRED',status
            d.execute_script("localStorage.removeItem('nosmo-work:documents/v1')")

            d.get(base+'screen.html?screen=work')
            w.until(lambda x: not x.find_element(By.ID,'workScreen').get_attribute('hidden'))
            w.until(lambda x: x.execute_script("return !!window.NOSMO_WORK_PROFILE_BRIDGE?.getCard?.()"))
            card=d.execute_script('return window.NOSMO_WORK_PROFILE_BRIDGE.getCard()')
            assert card['profile']['currentRole']=='',card
            for key in ['recentProjects','workHistory','references','skills','licences','notes']:
              assert card[key]==[],(key,card[key])
            work_text=d.find_element(By.ID,'workScreen').text
            for fake in ['City Centre Refurbishment','Residential Fit-Out','Second Fix Joinery','CSCS / trade card']:
              assert fake not in work_text,fake

            w.until(lambda x: x.execute_script("return document.querySelector('#jobHubList')!==null"))
            w.until(lambda x: 'No jobs saved or found yet' in x.find_element(By.ID,'jobHubList').text)
            assert len(d.find_elements(By.CSS_SELECTOR,'#jobHubList [data-prepare]'))==0
            d.execute_script("document.querySelector('[data-hub-tab=\"employers\"]').click()")
            w.until(lambda x: not x.find_element(By.CSS_SELECTOR,'[data-hub-panel="employers"]').get_attribute('hidden'))
            w.until(lambda x: 'No employer records match' in x.find_element(By.ID,'employerHubList').text)
            assert len(d.find_elements(By.CSS_SELECTOR,'#employerHubList .hubCard'))==0

            profile=d.execute_async_script("var done=arguments[0];fetch('./data/default-worker-profile.json').then(r=>r.json()).then(done).catch(e=>done({error:e.message}));")
            assert profile['version']=='V1.0102',profile
            assert profile['jobGateway']['endpoint']=='',profile['jobGateway']
            assert profile['jobGateway']['status']=='standalone-unconfigured',profile['jobGateway']

            d.get(base+'screen.html?screen=documents&demo=1')
            w.until(lambda x: not x.find_element(By.ID,'documentsScreen').get_attribute('hidden'))
            w.until(lambda x: x.execute_script("return typeof allDocuments==='function'"))
            assert d.execute_script('return allDocuments().length')>=7
            assert 'CSCS / trade card placeholder' in d.find_element(By.ID,'documentsScreen').text

            d.get(base+'screen.html?screen=work&demo=1')
            w.until(lambda x: not x.find_element(By.ID,'workScreen').get_attribute('hidden'))
            w.until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'#jobHubList [data-prepare]'))>=1)
            assert 'NorthBuild Recruitment' in d.find_element(By.ID,'jobHubList').text

            d.get(base+'index.html')
            d.execute_async_script("var done=arguments[0];navigator.serviceWorker.ready.then(()=>done(true)).catch(()=>done(false));")
            keys=d.execute_async_script("var done=arguments[0];caches.keys().then(done).catch(()=>done([]));")
            assert any(k.startswith('nosmo-work-v10102-canonical-20260906-2') for k in keys),keys

            print('NOSMO_WORK_V1_0102_FRESH_STATE_QA_PASS')
          finally:
            d.quit()
          PY
