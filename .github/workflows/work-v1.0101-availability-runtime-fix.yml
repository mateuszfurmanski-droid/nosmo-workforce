name: NOSMO Work V1.0101 Availability Runtime Fix

on:
  push:
    branches:
      - codex/work-v1.0101-migration
    paths:
      - scripts/fix_work_v10101_availability.py
      - .github/workflows/work-v1.0101-availability-runtime-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact migration head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply availability recursion fix
        run: python scripts/fix_work_v10101_availability.py

      - name: Verify runtime guard
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'let availabilitySyncing=false;' apps/work/js/work-v1-runtime.js
          grep -Fq 'if(availabilitySyncing)return;' apps/work/js/work-v1-runtime.js
          grep -Fq 'finally { availabilitySyncing=false; }' apps/work/js/work-v1-runtime.js

      - name: Commit fixed runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/work/js/work-v1-runtime.js scripts/promote_work_v10101.py
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'fix(work): prevent availability save recursion'
            git push origin HEAD:codex/work-v1.0101-migration
          fi
