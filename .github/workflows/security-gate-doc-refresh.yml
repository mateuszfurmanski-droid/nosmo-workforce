name: NOSMO Security Gate Document Refresh

on:
  push:
    branches:
      - security/nosmo-security-gate
    paths:
      - .github/workflows/security-gate-doc-refresh.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nosmo-security-gate
      - name: Refresh SECURITY_GATE evidence
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('SECURITY_GATE.md')
          text = p.read_text()

          def one(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          def regex_one(pattern, replacement, flags=0):
              global text
              text2, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'expected one regex match, found {count}: {pattern[:100]!r}')
              text = text2

          one('Date: 2026-09-07', 'Date: 2026-09-11')
          regex_one(
              r'Canonical source inspected before changes: `main` at `c4d8b544f98e0e39d612b2ceff7f5f5162589b8d`.*?Pull request: #18\.',
              'Canonical source was initially inspected at `main` commit `c4d8b544f98e0e39d612b2ceff7f5f5162589b8d`. Before the 2026-09-11 continuation, the security branch was re-inspected and merged with current `main` at `911557f489721affba7ae414f49db36f20375b25` without force-push or UI replacement. Security hardening remains on `security/nosmo-security-gate`. Pull request: #18.',
          )
          one(
              '- NOSMO Work / Worker remains a static PWA. The worker onboarding and availability handoff call Agency-hosted serverless endpoints with signed worker authority tokens.',
              '- NOSMO Work / Worker is now a Next/Vinext application with a same-origin `/api/worker/*` server boundary. Worker identity is resolved server-side from the platform-authenticated `oai-authenticated-user-email` header, pseudonymised with `NEXUS_IDENTITY_PEPPER`, and bound to `person_id` through `nexus_identity_bindings`. The previous normal-path draft-token/localStorage authority description is no longer the canonical Worker architecture. GitHub Pages now serves only a canonical redirect, not the Worker application runtime.'
          )
          regex_one(
              r'Remaining Worker security blocker: the static Worker app currently stores its signed draft authority token.*?without adding a real Worker authentication boundary\.',
              'Current Worker security assessment: the canonical Worker API no longer uses the old signed draft authority token in `localStorage` for normal authenticated status/connection operations. Invite preview tokens have also been removed from query-string URLs and are sent only in a same-origin POST body. However, the browser intentionally retains substantial local-first personal data in browser storage, including Worker profile fields, imported Work Contacts containing names/phone/email, document metadata, and locally stored imported files. That local-device persistence is a privacy, device-compromise, shared-device and data-lifecycle risk. Before a genuine personal-data pilot, NOSMO must verify the deployed authentication-header trust boundary, define retention/clear-device behavior, and confirm that local-first storage matches the promised Worker privacy model.',
              flags=re.S,
          )
          one(
              'Worker onboarding does not use the Agency session cookie. It uses signed bearer authority in the request body with an explicit CORS origin allow-list and the Worker client uses `credentials:"omit"`. Therefore synchronizer-token CSRF is not applied to that non-cookie authority model.',
              'Current Worker API requests are same-origin and use the platform-authenticated Worker identity supplied to the server. State-changing Worker API calls now fail closed unless an `Origin` header is present and exactly matches the request origin; the outer Worker security boundary and the inner handler both enforce this. Invite preview/acceptance is POST-based and the invite token is carried in the JSON body, not the URL. The production trust assumption that clients cannot forge or bypass the platform identity header still requires live deployment verification.'
          )
          one(
              'Worker is currently deployed as a static PWA through GitHub Pages workflow. Repository code alone cannot guarantee the same custom HTTP header set from that hosting surface. Worker hosting/CSP/header behavior remains a deployment verification item.',
              'GitHub Pages is now configured only as a canonical redirect surface for NOSMO Work. The Worker application itself has baseline browser headers in `next.config.ts` (`nosniff`, frame denial, `no-referrer`, restrictive Permissions-Policy, COOP and HSTS) and API responses add `Cache-Control: no-store`. A strict Worker CSP was not forced without runtime verification because the current Next/Vinext build may require framework script behavior. The actual canonical Worker host, header provenance and CSP behavior remain deployment-verification items.'
          )

          marker = 'Current limiter is process-instance memory and therefore is not a globally consistent distributed rate limiter across multiple serverless instances. For a controlled small pilot it is defense-in-depth, not the sole abuse-control guarantee. Production scale should add provider/edge/global rate limiting (for example at Vercel Firewall/edge or another shared limiter).'
          one(marker, marker + '\n\nWorker `/api/worker/*` now has a separate best-effort per-instance boundary: 120 requests/minute general, 30 requests/minute for connection flows, plus a 64 KiB mutation Content-Length limit. Like the Agency limiter, this is not a substitute for a distributed provider/edge control.')

          evidence_anchor = '## 14. Automated tests completed\n'
          one(evidence_anchor, evidence_anchor + '\n2026-09-11 Worker security additions:\n\n- permanent Worker API boundary regression tests for same-origin mutation enforcement, request-size limits, rate limiting, URL credential rejection and browser security headers\n- Worker invite preview regression updated to require POST body token transport and to reject `/connection?token=...`\n- security workflow now runs a distinct Worker job; watching `apps/work/**` no longer gives a false green result from Agency-only tests\n- Worker production dependency audit initially exposed one critical and four high production issues; Next and safe transitive dependencies were patched, including Next `16.2.6` -> `16.3.4`\n- final Worker production audit (`npm audit --omit=dev --audit-level=high`) passed with **0 production vulnerabilities**\n- full development-tooling audit still reports 14 issues (10 high, 4 moderate) in build/dev tooling such as Vinext/Vite/Wrangler/Cloudflare/Drizzle-related chains; resolving all currently requires breaking upgrades, so these are tracked rather than hidden with `--force`\n')

          one(
              '4. Worker draft authority and personal draft data remain accessible to Worker JavaScript/localStorage; Worker has no equivalent HttpOnly authenticated session boundary.\n5. Custom Worker hosting security headers/CSP are not yet verified.',
              '4. Worker authentication now depends on a platform-supplied `oai-authenticated-user-email` header; the deployed trust boundary has not yet been proven to strip client spoofing or prevent direct-origin bypass.\n5. Worker local-first PII persists in browser localStorage/IndexedDB/local files; retention, shared-device clearing and device-compromise behavior are not yet approved for a genuine PII pilot.\n6. Worker baseline headers exist in code, but the actual canonical host and strict CSP behavior are not yet verified.'
          )
          text = text.replace('6. Production database application role/least privilege is not proven from the current deployment configuration.\n7. Backup retention is only the currently observed 6-hour Neon history setting and no restore drill has been completed.\n8. In-process rate limiting is not globally distributed across Vercel instances.', '7. Production database application role/least privilege is not proven from the current deployment configuration.\n8. Backup retention is only the currently observed 6-hour Neon history setting and no restore drill has been completed.\n9. In-process rate limiting is not globally distributed across serverless instances.', 1)

          ext_anchor = '- confirm application database role privileges and provider network policy\n- define recovery retention and perform a non-production restore drill'
          one(ext_anchor, '- verify the canonical Worker deployment rejects/overwrites client-supplied authentication headers and cannot bypass the trusted identity perimeter\n- verify Worker baseline headers on the real host and introduce/test a compatible CSP\n- define Worker local-device PII retention, clear-device/shared-device behavior and user-facing privacy controls\n' + ext_anchor)

          class_anchor = '- Recruiter-safe Worker consent/private-field boundaries are present.'
          one(class_anchor, class_anchor + '\n- Worker API mutations now fail closed on missing/cross-origin Origin, invite credentials are removed from URLs, baseline response headers/rate limits/payload limits are present, and Worker production dependencies pass the high-severity production audit gate.')

          p.write_text(text)
          PY
      - name: Verify document classification and superseded claims
        run: |
          grep -Fq '# DEMO ONLY' SECURITY_GATE.md
          grep -Fq 'main` at `911557f489721affba7ae414f49db36f20375b25' SECURITY_GATE.md
          grep -Fq 'Next `16.2.6` -> `16.3.4`' SECURITY_GATE.md
          grep -Fq '0 production vulnerabilities' SECURITY_GATE.md
          grep -Fq '14 issues (10 high, 4 moderate)' SECURITY_GATE.md
          grep -Fq 'oai-authenticated-user-email' SECURITY_GATE.md
          grep -Fq 'GitHub Pages is now configured only as a canonical redirect' SECURITY_GATE.md
          ! grep -Fq 'static Worker app currently stores its signed draft authority token' SECURITY_GATE.md
          ! grep -Fq 'Worker is currently deployed as a static PWA through GitHub Pages workflow' SECURITY_GATE.md
      - name: Commit refreshed security gate
        run: |
          git config user.name "NOSMO Security Gate"
          git config user.email "security-gate@users.noreply.github.com"
          git add SECURITY_GATE.md
          git commit -m "docs(security): refresh Worker gate evidence"
          git push origin HEAD:security/nosmo-security-gate
