name: Complete NOSMO Agency Sites static closure v2

on:
  push:
    branches:
      - fix/agency-sites-v24-1to1
    paths:
      - '.github/workflows/complete-agency-sites-static-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agency-sites-v24-1to1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch exact referenced live static files
        run: node .github/scripts/complete-agency-sites-assets.mjs
      - name: Commit exact static closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/agency/sites/v24/public apps/agency/sites/v24/CAPTURE_MANIFEST.json apps/agency/sites/v24/ASSET_CLOSURE.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(agency): complete exact Sites static dependency closure"
          git push origin HEAD:fix/agency-sites-v24-1to1
