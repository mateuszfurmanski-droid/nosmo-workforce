name: TMP NOSMO Work V1.0102 Finalise

on:
  push:
    branches:
      - tmp/work-v1.0102-finalise-patch
    paths:
      - .github/workflows/tmp-work-v1.0102-finalise.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply V1.0102 finalisation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          # screen shell cleanup + exact availability labels + visible real install surface
          p=Path('apps/work/screen.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('grid-template-columns:repeat(4,1fr)', 'grid-template-columns:repeat(5,1fr)')
          s=s.replace('document.title="NOSMO Person Card Freeware — "+screens[next].title;', 'document.title="NOSMO Work — "+screens[next].title;')
          s=s.replace('This route is reserved inside the same Person Card Freeware application.', 'This route is reserved inside NOSMO Work.')
          s=s.replace('This route stays inside the same Person Card Freeware application.', 'This route stays inside NOSMO Work.')
          s=s.replace('availability:"Available now"', 'availability:"Available"')
          s=s.replace('card.profile.availability||"Available now"', 'card.profile.availability||"Available"')
          s=s.replace('document.getElementById("workAvailability").value!=="Available from date"', 'document.getElementById("workAvailability").value!=="Ready on date"')
          s=s.replace('document.getElementById("workAvailability").value==="Available from date"', 'document.getElementById("workAvailability").value==="Ready on date"')
          s=s.replace('event.target.value!=="Available from date"', 'event.target.value!=="Ready on date"')
          old='''<label><span>Availability</span><select id="workAvailability">\n          <option>Available now</option>\n          <option>Available from date</option>\n          <option>Not available</option>\n        </select></label>'''
          new='''<label><span>Availability</span><select id="workAvailability">\n          <option>Available</option>\n          <option>Busy</option>\n          <option>Ready on date</option>\n        </select></label>'''
          assert old in s, 'availability select block not found'
          s=s.replace(old,new,1)
          install_anchor='''    <button class="settingsAction" id="settingsWorkModeButton" type="button"><span><strong>Work Mode</strong><small>Open site tools and local work apps</small></span><b>›</b></button>'''
          install_block=install_anchor+'''\n    <button class="settingsAction" id="settingsInstallButton" type="button" hidden><span><strong>Install NOSMO Work</strong><small>Install the real PWA on this device</small></span><b>↓</b></button>\n    <div class="canonicalPrivacy" id="settingsInstallState">Install appears only when the browser confirms PWA eligibility.</div>'''
          assert install_anchor in s, 'settings install anchor not found'
          s=s.replace(install_anchor,install_block,1)
          p.write_text(s,encoding='utf-8')

          # canonical work profile bridge now speaks V1.0102 labels while accepting old stored labels
          p=Path('apps/work/js/canonical-work-profile-bridge.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('function availability(p){const a=p.availability||{};if(a.status==="available-from")return "Available from date";if(a.status==="available")return "Available now";return "Not available"}',
                      'function availability(p){const a=p.availability||{};if(a.status==="available-from"||a.status==="from-date")return "Ready on date";if(a.status==="available")return "Available";return "Busy"}')
          old='const label=card.profile?.availability;profile.availability.status=label==="Available now"?"available":label==="Available from date"?"available-from":"not-available";profile.availability.availableFrom=card.profile?.availableFrom||"";'
          new='const label=card.profile?.availability;profile.availability.status=(label==="Available"||label==="Available now")?"available":(label==="Ready on date"||label==="Available from date")?"available-from":"busy";profile.availability.availableFrom=card.profile?.availableFrom||"";'
          assert old in s, 'bridge availability mapping not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # expose the genuine beforeinstallprompt flow in Settings too; never fake installability
          p=Path('apps/work/js/work-v1-runtime.js')
          s=p.read_text(encoding='utf-8')
          pat=r"  function updateInstallUi\(\)\{.*?\n  \}\n  async function installApp\(\)\{"
          repl='''  function updateInstallUi(){\n    const buttons=[document.getElementById('workInstallButton'),document.getElementById('settingsInstallButton')].filter(Boolean);\n    const states=[document.getElementById('workInstallState'),document.getElementById('settingsInstallState')].filter(Boolean);\n    const lang=localStorage.getItem(KEYS.lang)||'en';\n    const installed=standalone();\n    const status=installed?get('installed'):(deferredInstallPrompt?(T[lang]?.installReady||fallback.installReady):(T[lang]?.installUnavailable||fallback.installUnavailable));\n    buttons.forEach(btn=>{btn.hidden=installed||!deferredInstallPrompt;btn.textContent=get('install')});\n    states.forEach(state=>state.textContent=status);\n  }\n  async function installApp(){'''
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          assert n==1, f'install UI function replacement count {n}'
          s=s2
          anchor="    pop.querySelector('#workInstallButton')?.addEventListener('click',installApp);"
          assert anchor in s, 'install listener anchor not found'
          s=s.replace(anchor,anchor+"\n    document.getElementById('settingsInstallButton')?.addEventListener('click',installApp);",1)
          p.write_text(s,encoding='utf-8')

          # make hidden install row actually hidden despite .settingsAction display:flex
          p=Path('apps/work/css/work-v10101-canonical.css')
          s=p.read_text(encoding='utf-8')
          if '.settingsAction[hidden]' not in s:
              s += '\n.settingsAction[hidden]{display:none!important}\n'
          p.write_text(s,encoding='utf-8')

          # robust PWA cache versioning and old-cache cleanup
          p=Path('apps/work/sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const CACHE='nosmo-work-v10101-canonical-20260905-1';", "const CACHE='nosmo-work-v10102-canonical-20260906-1';")
          s=s.replace("key.startsWith('nosmo-work-v1-')", "key.startsWith('nosmo-work-v1')")
          core_anchor="  './manifest.webmanifest','./css/asia-hub-theme.css','./css/work-v1-final.css',"
          core_new="  './manifest.webmanifest','./assets/pwa/icon-192.png','./assets/pwa/icon-512.png','./assets/pwa/icon-512-maskable.png','./data/default-worker-profile.json','./css/asia-hub-theme.css','./css/work-v1-final.css',"
          assert core_anchor in s, 'service worker core anchor missing'
          s=s.replace(core_anchor,core_new,1)
          p.write_text(s,encoding='utf-8')

          Path('apps/work/version.json').write_text(json.dumps({
              'product':'NOSMO Work','version':'V1.0102','baseline':'V1.0101','channel':'finalisation','date':'2026-09-06'
          },indent=2)+'\n',encoding='utf-8')
          PY

      - name: Static assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "nosmo-work-v10102-canonical" apps/work/sw.js
          grep -Fq "key.startsWith('nosmo-work-v1')" apps/work/sw.js
          grep -Fq 'id="settingsInstallButton"' apps/work/screen.html
          grep -Fq '<option>Available</option>' apps/work/screen.html
          grep -Fq '<option>Busy</option>' apps/work/screen.html
          grep -Fq '<option>Ready on date</option>' apps/work/screen.html
          grep -Fq 'document.title="NOSMO Work — "+screens[next].title;' apps/work/screen.html
          ! grep -Fq 'NOSMO Person Card Freeware —' apps/work/screen.html
          echo NOSMO_WORK_V1_0102_STATIC_PASS

      - name: Commit V1.0102 finalisation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/work
          git commit -m 'fix(work): finalise V1.0102 install and shell behaviour'
          git push origin HEAD:tmp/work-v1.0102-finalise-patch
