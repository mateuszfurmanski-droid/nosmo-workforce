name: NOSMO Work V1.0101 Final Sanitize

on:
  push:
    branches:
      - codex/work-v1.0101-migration
    paths:
      - .github/workflows/work-v1.0101-final-sanitize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Remove residual donor identity and missing photo asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path('apps/work')
          text_suffixes={'.html','.js','.mjs','.json','.css','.md','.webmanifest'}
          replacements=[
              ("background:#fff url('assets/WorkerCard.jpeg') center 18%/cover no-repeat", "background:#0b1624"),
              ('person-card-kamil-v47.html','index.html'),
              ('person=kamil-karaszewski','person=worker-profile'),
              ('focus=p-kamil','focus=worker-profile'),
              ('person-card-kamil-section','worker-card-section'),
              ('card=/person-card-kamil','card=/worker-card'),
              ('kamil-karaszewski','worker-profile'),
              ('p-kamil','worker-profile'),
              ('person-card-kamil','worker-card'),
              ('Kamil Karaszewski','Worker Profile'),
              ('Karaszewski','Profile'),
              ('Kamil','Worker'),
          ]
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if path.suffix.lower() not in text_suffixes and path.name != 'manifest.webmanifest':
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original=text
              for old,new in replacements:
                  text=text.replace(old,new)
              if text!=original:
                  path.write_text(text,encoding='utf-8')
          PY

      - name: Audit canonical Work for donor identity
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniI -E 'Kamil|Karaszewski|kamil-karaszewski|WorkerCard\.jpeg|person-card-kamil' apps/work; then
            echo 'Residual donor identity or missing donor image reference found.' >&2
            exit 1
          fi
          echo NOSMO_WORK_V1_0101_SANITIZE_PASS

      - name: Commit sanitized canonical Work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/work
          if git diff --cached --quiet; then
            echo 'No sanitize changes required.'
          else
            git commit -m 'chore(work): sanitize canonical V1.0101 source'
            git push origin HEAD:codex/work-v1.0101-migration
          fi
