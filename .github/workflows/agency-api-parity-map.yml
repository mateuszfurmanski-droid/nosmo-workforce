name: NOSMO Agency API parity map

on:
  push:
    branches:
      - fix/agency-sites-v24-backend-parity
    paths:
      - '.github/workflows/agency-api-parity-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agency-sites-v24-backend-parity
          fetch-depth: 1

      - name: Extract frontend API contract and backend routes
        run: |
          node <<'NODE'
          const fs = require('fs');

          const frontPath = 'apps/agency/sites/v24/public/assets/page-D2n6_To6.js';
          const backendPaths = [
            'apps/agency/legacy/v1.0024/backend/agency.ts',
            'apps/agency/legacy/v1.0024/backend/agency-v1-finalisation.ts'
          ];
          const front = fs.readFileSync(frontPath, 'utf8');
          const back = backendPaths.map(p => fs.readFileSync(p, 'utf8')).join('\n');

          const frontendCalls = new Map();
          const qRe = /Q\(`([^`]+)`(?:,\{method:`([A-Z]+)`)?/g;
          let m;
          while ((m = qRe.exec(front))) {
            const route = m[1];
            const method = m[2] || 'GET';
            frontendCalls.set(`${method} ${route}`, { method, route });
          }

          const backendRoutes = [];
          const rRe = /router\.(get|post|patch|delete|put)\("([^"]+)"/g;
          while ((m = rRe.exec(back))) {
            backendRoutes.push({ method: m[1].toUpperCase(), route: m[2] });
          }

          const normalizeBackend = route => route
            .replace(/^\/person-card\/agency\/v1/, '')
            .replace(/^\/person-card\/agency/, '');

          const normalizeFront = route => route
            .replace(/\?.*$/, '')
            .replace(/\$\{[^}]+\}/g, ':param');

          const normalizeParams = route => route.replace(/:[A-Za-z0-9_]+/g, ':param');

          const calls = [...frontendCalls.values()].sort((a,b)=>`${a.method} ${a.route}`.localeCompare(`${b.method} ${b.route}`));
          const mapped = calls.map(call => {
            const fn = normalizeParams(normalizeFront(call.route));
            const candidates = backendRoutes.filter(r => r.method === call.method && normalizeParams(normalizeBackend(r.route)) === fn);
            return {
              ...call,
              normalizedFrontendRoute: fn,
              status: candidates.length ? 'MAPPED' : 'MISSING',
              backendRoutes: candidates.map(r => r.route)
            };
          });

          const result = {
            schema: 'nosmo-agency-api-parity-map/v1',
            sourceFrontend: frontPath,
            sourceBackend: backendPaths,
            generatedAt: new Date().toISOString(),
            frontendCallCount: mapped.length,
            mappedCount: mapped.filter(x=>x.status==='MAPPED').length,
            missingCount: mapped.filter(x=>x.status==='MISSING').length,
            calls: mapped,
            backendRoutes: backendRoutes.sort((a,b)=>`${a.method} ${a.route}`.localeCompare(`${b.method} ${b.route}`))
          };

          fs.writeFileSync('apps/agency/API_PARITY_MAP.json', JSON.stringify(result, null, 2) + '\n');
          fs.writeFileSync('apps/agency/API_PARITY_MAP.md', [
            '# NOSMO Agency API parity map',
            '',
            `Frontend calls: ${result.frontendCallCount}`,
            `Mapped: ${result.mappedCount}`,
            `Missing: ${result.missingCount}`,
            '',
            '| Method | Frontend route | Status | Backend route |',
            '|---|---|---|---|',
            ...mapped.map(x=>`| ${x.method} | \`${x.route}\` | ${x.status} | ${x.backendRoutes.map(r=>'`'+r+'`').join('<br>')} |`)
          ].join('\n') + '\n');

          console.log(JSON.stringify({frontendCallCount: result.frontendCallCount, mappedCount: result.mappedCount, missingCount: result.missingCount, missing: mapped.filter(x=>x.status==='MISSING')}, null, 2));
          NODE

      - name: Commit parity map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/agency/API_PARITY_MAP.json apps/agency/API_PARITY_MAP.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(agency): record exact Sites API parity map"
          git push origin HEAD:fix/agency-sites-v24-backend-parity
