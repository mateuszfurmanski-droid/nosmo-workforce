name: Hotfix Agency runtime schema parity

on:
  push:
    branches: [fix/agency-runtime-roster-link]
    paths: ['.github/workflows/hotfix-agency-roster-link.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agency-runtime-roster-link
      - name: Replace invalid placement ON CONFLICT target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/agency/runtime/compat.js')
          s=p.read_text()
          start='const existing=await query(`select placement_id as "placementId" from nexus_person_agency_placements where agency_id=$1 and application_id=$2 limit 1`'
          end=';await query(`update nexus_person_agency_applications set stage=\'PLACED\''
          a=s.find(start)
          b=s.find(end,a)
          if a < 0 or b < 0:
              raise SystemExit(f'placement markers not found: start={a}, end={b}')
          old=s[a:b]
          if 'on conflict (agency_id,application_id)' not in old:
              raise SystemExit('expected invalid placement ON CONFLICT is not inside target block')
          repl='''const existing=await query(`select placement_id as "placementId" from nexus_person_agency_placements where agency_id=$1 and application_id=$2 limit 1`,[agency.agencyId,applicationId]),placementId=existing.rows[0]?.placementId||uuid("agency-placement"),currency=clean(req.body?.currency,12)?.toUpperCase()||"GBP",payRate=safeNumber(req.body?.payRate),billRate=safeNumber(req.body?.billRate),placementRecord=JSON.stringify({readinessConfirmed:req.body?.readinessConfirmed===true,payrollCalculated:false});if(existing.rows.length)await query(`update nexus_person_agency_placements set request_id=$3,status='PLACED',start_date=$4,end_date=$5,currency=$6,rate_unit=$7,pay_rate_amount=$8,bill_rate_amount=$9,record_json=$10::jsonb,updated_by_user_id=$11,updated_at=now() where agency_id=$1 and placement_id=$2`,[agency.agencyId,placementId,application.requestId,startDate,endDate,currency,rateUnit,payRate,billRate,placementRecord,req.user.id]);else await query(`insert into nexus_person_agency_placements (placement_id,agency_id,request_id,application_id,status,start_date,end_date,currency,rate_unit,pay_rate_amount,bill_rate_amount,record_json,created_by_user_id,updated_by_user_id,created_at,updated_at) values ($1,$2,$3,$4,'PLACED',$5,$6,$7,$8,$9,$10,$11::jsonb,$12,$12,now(),now())`,[placementId,agency.agencyId,application.requestId,applicationId,startDate,endDate,currency,rateUnit,payRate,billRate,placementRecord,req.user.id])'''
          s2=s[:a]+repl+s[b:]
          if 'on conflict (agency_id,application_id)' in s2:
              raise SystemExit('invalid placement ON CONFLICT remains')
          if 'linked_person_id' in s2:
              raise SystemExit('invalid linked_person_id reference remains')
          p.write_text(s2)
          PY
      - name: Validate runtime contract
        run: |
          set -euo pipefail
          node --check apps/agency/runtime/compat.js
          node --check apps/agency/runtime/server.js
          node apps/agency/runtime/tests/contract.mjs
          grep -q 'claimed_person_id' apps/agency/runtime/compat.js
          grep -q 'if(existing.rows.length)await query(`update nexus_person_agency_placements' apps/agency/runtime/compat.js
          ! grep -q 'linked_person_id' apps/agency/runtime/compat.js
          ! grep -q 'on conflict (agency_id,application_id)' apps/agency/runtime/compat.js
          test "$(git diff --name-only -- apps/work | wc -l)" -eq 0
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/agency/runtime/compat.js
          git commit -m "fix(agency): align placement write with Neon constraints"
          git push origin HEAD:fix/agency-runtime-roster-link
