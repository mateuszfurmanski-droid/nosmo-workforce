name: Capture NOSMO Agency Sites v24 lazy chunks

on:
  push:
    branches:
      - fix/agency-sites-v24-1to1
    paths:
      - '.github/workflows/capture-agency-sites-v24-lazy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-lazy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agency-sites-v24-1to1
      - name: Download exact lazy chunks
        shell: bash
        run: |
          set -euo pipefail
          base='https://nosmo-agency.mateusz-furmanski.chatgpt.site/assets'
          out='apps/agency/sites/v24/public/assets'
          mkdir -p "$out"
          for f in webpack-bqEODIzK.js src-Cux5XbTP.js lib-CX2z2z0g.js; do
            curl -fL --retry 3 --retry-delay 1 "$base/$f" -o "$out/$f"
            test -s "$out/$f"
            sha256sum "$out/$f"
          done
      - name: Verify dependency names are now complete
        shell: bash
        run: |
          set -euo pipefail
          for f in webpack-bqEODIzK.js src-Cux5XbTP.js lib-CX2z2z0g.js; do test -s "apps/agency/sites/v24/public/assets/$f"; done
      - name: Commit lazy chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/agency/sites/v24/public/assets
          git commit -m "chore(agency): preserve remaining Sites v24 lazy chunks"
          git push origin HEAD:fix/agency-sites-v24-1to1
