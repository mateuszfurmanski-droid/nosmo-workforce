name: NOSMO Work Pages canonical redirect

on:
  push:
    branches:
      - main
    paths:
      - .github/static/work-pages-redirect.html
      - .github/static/work-pages-retire-sw.js
      - .github/workflows/work-preview-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nosmo-work-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Build canonical redirect
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/work
          cp .github/static/work-pages-redirect.html _site/index.html
          cp .github/static/work-pages-redirect.html _site/work/index.html
          cp .github/static/work-pages-retire-sw.js _site/work/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload redirect
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy redirect
        id: deployment
        uses: actions/deploy-pages@v4
