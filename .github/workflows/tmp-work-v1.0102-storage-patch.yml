name: TMP NOSMO Work V1.0102 Storage Patch

on:
  push:
    branches:
      - tmp/work-v1.0102-storage-migration
    paths:
      - .github/workflows/tmp-work-v1.0102-storage-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply NOSMO Work storage namespace migration
        shell: bash
        run: |
          cat > apps/work/js/work-storage-migration.js <<'JS'
          (function(){
            "use strict";
            const MARKER="nosmo-work:migration:person-card-freeware/v1";
            const DB_MARKER="nosmo-work:migration:indexeddb-files/v1";
            const PAIRS=[
              ["nosmo-person-card-freeware:documents/v1","nosmo-work:documents/v1"],
              ["nosmo-person-card-freeware:work-card/v2","nosmo-work:work-card/v2"],
              ["nosmo-person-card-freeware:work-card/v1","nosmo-work:work-card/v1"],
              ["nosmo-person-card-freeware:jobs/v1","nosmo-work:jobs/v1"],
              ["nosmo-person-card-freeware:applications/v1","nosmo-work:applications/v1"],
              ["nosmo-person-card-freeware:employers/v1","nosmo-work:employers/v1"],
              ["nosmo-person-card-freeware:application-log/v1","nosmo-work:application-log/v1"],
              ["nosmo-person-card-freeware:file-registry/v1","nosmo-work:file-registry/v1"]
            ];
            const OLD_DRAFT_PREFIX="nosmo-person-card-freeware:contact-draft/v1:";
            const NEW_DRAFT_PREFIX="nosmo-work:contact-draft/v1:";
            const OLD_DB="nosmo-person-card-freeware-files-v1";
            const NEW_DB="nosmo-work-files-v1";
            const STORE="files";

            function copyLocalStorage(){
              if(!window.localStorage)return;
              PAIRS.forEach(([oldKey,newKey])=>{
                if(localStorage.getItem(newKey)!==null)return;
                const value=localStorage.getItem(oldKey);
                if(value!==null)localStorage.setItem(newKey,value);
              });
              const keys=[];
              for(let i=0;i<localStorage.length;i++)keys.push(localStorage.key(i));
              keys.filter(Boolean).filter(key=>key.startsWith(OLD_DRAFT_PREFIX)).forEach(oldKey=>{
                const newKey=NEW_DRAFT_PREFIX+oldKey.slice(OLD_DRAFT_PREFIX.length);
                if(localStorage.getItem(newKey)===null)localStorage.setItem(newKey,localStorage.getItem(oldKey));
              });
              localStorage.setItem(MARKER,new Date().toISOString());
            }

            function openNewDb(){
              return new Promise((resolve,reject)=>{
                const req=indexedDB.open(NEW_DB,1);
                req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:"id"});};
                req.onsuccess=()=>resolve(req.result);
                req.onerror=()=>reject(req.error||new Error("NOSMO_WORK_DB_OPEN_FAILED"));
              });
            }
            function openLegacyDb(){
              return new Promise(resolve=>{
                if(!window.indexedDB){resolve(null);return;}
                const req=indexedDB.open(OLD_DB);
                let created=false;
                req.onupgradeneeded=()=>{created=true;try{req.transaction.abort()}catch(_){}};
                req.onerror=()=>resolve(null);
                req.onsuccess=()=>{if(created){try{req.result.close();indexedDB.deleteDatabase(OLD_DB)}catch(_){}resolve(null);return}resolve(req.result);};
              });
            }
            async function migrateDb(){
              if(!window.indexedDB)return false;
              if(localStorage.getItem(DB_MARKER))return true;
              const oldDb=await openLegacyDb();
              const newDb=await openNewDb();
              try{
                if(oldDb&&oldDb.objectStoreNames.contains(STORE)){
                  const rows=await new Promise((resolve,reject)=>{
                    const req=oldDb.transaction(STORE,"readonly").objectStore(STORE).getAll();
                    req.onsuccess=()=>resolve(req.result||[]);
                    req.onerror=()=>reject(req.error||new Error("NOSMO_WORK_LEGACY_DB_READ_FAILED"));
                  });
                  if(rows.length){
                    await new Promise((resolve,reject)=>{
                      const tx=newDb.transaction(STORE,"readwrite");
                      const store=tx.objectStore(STORE);
                      rows.forEach(row=>store.put(row));
                      tx.oncomplete=()=>resolve();
                      tx.onerror=()=>reject(tx.error||new Error("NOSMO_WORK_DB_COPY_FAILED"));
                    });
                  }
                }
                localStorage.setItem(DB_MARKER,new Date().toISOString());
                return true;
              }finally{
                try{oldDb&&oldDb.close()}catch(_){}
                try{newDb.close()}catch(_){}
              }
            }

            try{copyLocalStorage()}catch(err){console.warn("NOSMO Work local storage migration skipped",err)}
            window.NOSMO_WORK_STORAGE_READY=migrateDb().catch(err=>{console.warn("NOSMO Work IndexedDB migration skipped",err);return false});
          })();
          JS

          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              assert old in s, f'missing anchor in {path}: {old[:60]}'
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          # Canonical profile bridge: new Work namespace; legacy import handled centrally.
          p=Path('apps/work/js/canonical-work-profile-bridge.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('const LEGACY="nosmo-person-card-freeware:work-card/v2";','const LEGACY="nosmo-work:work-card/v2";')
          s=s.replace('const MIGRATION="nosmo-person-card-freeware:canonical-work-profile-migrated/v1";','const MIGRATION="nosmo-work:migration:canonical-work-profile/v1";')
          p.write_text(s,encoding='utf-8')

          # Work Hub storage.
          p=Path('apps/work/js/work-hub.js'); s=p.read_text(encoding='utf-8')
          replacements={
            'nosmo-person-card-freeware:jobs/v1':'nosmo-work:jobs/v1',
            'nosmo-person-card-freeware:applications/v1':'nosmo-work:applications/v1',
            'nosmo-person-card-freeware:employers/v1':'nosmo-work:employers/v1',
            'nosmo-person-card-freeware:application-log/v1':'nosmo-work:application-log/v1',
            'nosmo-person-card-freeware:file-registry/v1':'nosmo-work:file-registry/v1',
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Contact engine storage + file bytes DB.
          p=Path('apps/work/js/contact-action-engine.js'); s=p.read_text(encoding='utf-8')
          replacements={
            'nosmo-person-card-freeware:file-registry/v1':'nosmo-work:file-registry/v1',
            'nosmo-person-card-freeware:application-log/v1':'nosmo-work:application-log/v1',
            'nosmo-person-card-freeware:contact-draft/v1:':'nosmo-work:contact-draft/v1:',
            'nosmo-person-card-freeware-files-v1':'nosmo-work-files-v1',
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          anchor='''  async function getStoredFile(id){\n    if(!id)return null;'''
          assert anchor in s
          s=s.replace(anchor,'''  async function getStoredFile(id){\n    if(!id)return null;\n    if(window.NOSMO_WORK_STORAGE_READY)await window.NOSMO_WORK_STORAGE_READY;''',1)
          p.write_text(s,encoding='utf-8')

          # Data/File Loader storage.
          p=Path('apps/work/data-fetcher/app.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('nosmo-person-card-freeware:file-registry/v1','nosmo-work:file-registry/v1')
          s=s.replace('nosmo-person-card-freeware-files-v1','nosmo-work-files-v1')
          anchor='''  async function addSelected(){\n    if(!selected.length){message("Choose one or more files first.","warn");return;}'''
          assert anchor in s
          s=s.replace(anchor,'''  async function addSelected(){\n    if(!selected.length){message("Choose one or more files first.","warn");return;}\n    if(window.NOSMO_WORK_STORAGE_READY)await window.NOSMO_WORK_STORAGE_READY;''',1)
          s=s.replace('schema:"nexus-person-card-data-fetcher-manifest/v2"','schema:"nosmo-work-data-fetcher-manifest/v1"')
          s=s.replace('a.download="person-card-file-manifest.json"','a.download="nosmo-work-file-manifest.json"')
          p.write_text(s,encoding='utf-8')

          # Documents / Work Card active screen storage.
          p=Path('apps/work/screen.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('nosmo-person-card-freeware:documents/v1','nosmo-work:documents/v1')
          s=s.replace('nosmo-person-card-freeware:work-card/v2','nosmo-work:work-card/v2')
          s=s.replace('nosmo-person-card-freeware:work-card/v1','nosmo-work:work-card/v1')
          s=s.replace('<script src="./js/canonical-work-profile-bridge.js?v=2"></script>','<script src="./js/work-storage-migration.js?v=10102"></script>\n<script src="./js/canonical-work-profile-bridge.js?v=2"></script>',1)
          p.write_text(s,encoding='utf-8')

          # Worker Card loads migration before any historical runtime can read storage.
          p=Path('apps/work/index.html'); s=p.read_text(encoding='utf-8')
          anchor='<script src="./js/person-onboarding-v47.js?v=freeware1"></script>'
          assert anchor in s
          s=s.replace(anchor,'<script src="./js/work-storage-migration.js?v=10102"></script>\n'+anchor,1)
          p.write_text(s,encoding='utf-8')

          # Data/File Loader loads same storage bridge from parent directory.
          p=Path('apps/work/data-fetcher/index.html'); s=p.read_text(encoding='utf-8')
          anchor='<script src="./app.js?v=freeware1"></script>'
          assert anchor in s
          s=s.replace(anchor,'<script src="../js/work-storage-migration.js?v=10102"></script>\n  '+anchor,1)
          p.write_text(s,encoding='utf-8')

          # Cache the migration bridge with the PWA shell.
          p=Path('apps/work/sw.js'); s=p.read_text(encoding='utf-8')
          anchor="  './js/work-v1-runtime.js','./js/work-v10101-shell.js',"
          assert anchor in s
          s=s.replace(anchor,"  './js/work-storage-migration.js','./js/work-v1-runtime.js','./js/work-v10101-shell.js',",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Audit active Work namespace
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'nosmo-work:applications/v1' apps/work/js/work-hub.js
          grep -Fq 'const DB_NAME="nosmo-work-files-v1"' apps/work/js/contact-action-engine.js
          grep -Fq 'const DB_NAME="nosmo-work-files-v1"' apps/work/data-fetcher/app.js
          grep -Fq 'work-storage-migration.js' apps/work/index.html
          grep -Fq 'work-storage-migration.js' apps/work/screen.html
          grep -Fq 'work-storage-migration.js' apps/work/data-fetcher/index.html
          if grep -RniI 'nosmo-person-card-freeware:' apps/work --exclude='work-storage-migration.js' --exclude='source-manifest.json'; then
            echo 'Active Work still writes/reads old Person Card Freeware storage namespace.' >&2
            exit 1
          fi
          echo NOSMO_WORK_V1_0102_STORAGE_NAMESPACE_PASS

      - name: Commit storage migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/work
          git commit -m 'refactor(work): migrate active storage to nosmo-work namespace'
          git push origin HEAD:tmp/work-v1.0102-storage-migration
