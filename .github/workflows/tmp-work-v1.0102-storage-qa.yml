name: TMP NOSMO Work V1.0102 Storage Migration QA

on:
  push:
    branches:
      - tmp/work-v1.0102-storage-migration
    paths:
      - .github/workflows/tmp-work-v1.0102-storage-qa.yml
      - apps/work/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start Work server
        shell: bash
        run: |
          python -m http.server 4173 --directory apps/work >/tmp/work-storage-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/work-storage-http.log
          exit 1
      - name: Install selenium
        run: python -m pip install --quiet selenium
      - name: Run storage migration acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          base='http://localhost:4173/'
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,15)

          legacy_docs=[{'id':'legacy-doc-1','name':'Legacy CSCS','type':'cards','expiry':'2027-01-01','source':'local'}]
          legacy_apps=[{'id':'legacy-app-1','jobId':'legacy-job','status':'TO APPLY','history':[]}]
          legacy_registry=[{'id':'legacy-file-1','name':'legacy-cv.pdf','type':'application/pdf','size':6,'fileRole':'cv','storage':'indexeddb-local'}]
          legacy_draft={'jobId':'legacy-job','channel':'email','draft':'legacy draft'}

          try:
            d.get(base+'index.html')
            w.until(lambda x: x.execute_script("return document.readyState")=='complete')
            seed={
              'nosmo-person-card-freeware:documents/v1':json.dumps(legacy_docs),
              'nosmo-person-card-freeware:applications/v1':json.dumps(legacy_apps),
              'nosmo-person-card-freeware:file-registry/v1':json.dumps(legacy_registry),
              'nosmo-person-card-freeware:contact-draft/v1:legacy-job':json.dumps(legacy_draft),
            }
            d.execute_script('''
              const seed=arguments[0];
              const remove=[
                'nosmo-work:documents/v1','nosmo-work:applications/v1','nosmo-work:file-registry/v1',
                'nosmo-work:contact-draft/v1:legacy-job','nosmo-work:migration:person-card-freeware/v1',
                'nosmo-work:migration:indexeddb-files/v1'
              ];
              remove.forEach(k=>localStorage.removeItem(k));
              Object.entries(seed).forEach(([k,v])=>localStorage.setItem(k,v));
            ''',seed)

            idb_seed=d.execute_async_script('''
              const done=arguments[0];
              const delNew=indexedDB.deleteDatabase('nosmo-work-files-v1');
              delNew.onerror=()=>done('DELETE_NEW_FAILED');
              delNew.onblocked=()=>done('DELETE_NEW_BLOCKED');
              delNew.onsuccess=()=>{
                const delOld=indexedDB.deleteDatabase('nosmo-person-card-freeware-files-v1');
                delOld.onerror=()=>done('DELETE_OLD_FAILED');
                delOld.onblocked=()=>done('DELETE_OLD_BLOCKED');
                delOld.onsuccess=()=>{
                  const open=indexedDB.open('nosmo-person-card-freeware-files-v1',1);
                  open.onupgradeneeded=()=>open.result.createObjectStore('files',{keyPath:'id'});
                  open.onerror=()=>done('OPEN_OLD_FAILED');
                  open.onsuccess=()=>{
                    const db=open.result;
                    const tx=db.transaction('files','readwrite');
                    tx.objectStore('files').put({
                      id:'legacy-file-1',name:'legacy-cv.pdf',size:6,type:'application/pdf',
                      addedAt:new Date().toISOString(),fileRole:'cv',storage:'indexeddb-local',
                      blob:new Blob(['legacy'],{type:'application/pdf'})
                    });
                    tx.oncomplete=()=>{db.close();done('OK')};
                    tx.onerror=()=>{db.close();done('PUT_OLD_FAILED')};
                  };
                };
              };
            ''')
            assert idb_seed=='OK', idb_seed

            d.refresh()
            w.until(lambda x: x.execute_script("return document.readyState")=='complete')
            ready=d.execute_async_script('''
              const done=arguments[0];
              const p=window.NOSMO_WORK_STORAGE_READY;
              if(!p){done('NO_STORAGE_PROMISE');return;}
              p.then(v=>done(v===false?'MIGRATION_FALSE':'OK')).catch(e=>done('ERR:'+e.message));
            ''')
            assert ready=='OK', ready

            values=d.execute_script('''return {
              docs:localStorage.getItem('nosmo-work:documents/v1'),
              apps:localStorage.getItem('nosmo-work:applications/v1'),
              registry:localStorage.getItem('nosmo-work:file-registry/v1'),
              draft:localStorage.getItem('nosmo-work:contact-draft/v1:legacy-job'),
              marker:localStorage.getItem('nosmo-work:migration:person-card-freeware/v1'),
              dbMarker:localStorage.getItem('nosmo-work:migration:indexeddb-files/v1'),
              oldApps:localStorage.getItem('nosmo-person-card-freeware:applications/v1')
            }''')
            assert json.loads(values['docs'])==legacy_docs, values
            assert json.loads(values['apps'])==legacy_apps, values
            assert json.loads(values['registry'])==legacy_registry, values
            assert json.loads(values['draft'])==legacy_draft, values
            assert values['marker'] and values['dbMarker'], values
            old_apps_before=values['oldApps']

            db_check=d.execute_async_script('''
              const done=arguments[0];
              function get(dbName){return new Promise((resolve,reject)=>{
                const req=indexedDB.open(dbName);
                req.onerror=()=>reject(new Error('open '+dbName));
                req.onsuccess=()=>{
                  const db=req.result;
                  if(!db.objectStoreNames.contains('files')){db.close();resolve(null);return;}
                  const tx=db.transaction('files','readonly');
                  const g=tx.objectStore('files').get('legacy-file-1');
                  g.onsuccess=()=>{const row=g.result;db.close();resolve(row?{id:row.id,name:row.name,size:row.size,fileRole:row.fileRole}:null)};
                  g.onerror=()=>{db.close();reject(g.error)};
                };
              })}
              Promise.all([get('nosmo-work-files-v1'),get('nosmo-person-card-freeware-files-v1')])
                .then(([fresh,legacy])=>done({fresh,legacy})).catch(e=>done({error:e.message}));
            ''')
            expected={'id':'legacy-file-1','name':'legacy-cv.pdf','size':6,'fileRole':'cv'}
            assert db_check.get('fresh')==expected, db_check
            assert db_check.get('legacy')==expected, db_check

            # Storage write-path check. UI interaction itself is covered by permanent Work QA;
            # use DOM click dispatch here so fixed navigation/headless viewport cannot mask storage behavior.
            d.get(base+'screen.html?screen=work')
            w.until(lambda x: not x.find_element(By.ID,'workScreen').get_attribute('hidden'))
            tab=d.find_element(By.CSS_SELECTOR,'[data-hub-tab="jobs"]')
            d.execute_script("arguments[0].click();",tab)
            w.until(EC.presence_of_element_located((By.CSS_SELECTOR,'#jobHubList [data-prepare]')))
            btn=d.find_element(By.CSS_SELECTOR,'#jobHubList [data-prepare]')
            d.execute_script("arguments[0].click();",btn)
            w.until(EC.presence_of_element_located((By.ID,'confirmApplicationSent')))
            new_apps=d.execute_script("return localStorage.getItem('nosmo-work:applications/v1')")
            old_apps_after=d.execute_script("return localStorage.getItem('nosmo-person-card-freeware:applications/v1')")
            parsed=json.loads(new_apps)
            assert len(parsed)>=2 and any(x.get('id')=='legacy-app-1' for x in parsed), parsed
            assert old_apps_after==old_apps_before, (old_apps_before,old_apps_after)

            d.get(base+'index.html')
            w.until(lambda x: x.execute_script("return document.querySelectorAll('.appWindowNav a[data-screen]').length") == 5)
            labels=d.execute_script("return Array.from(document.querySelectorAll('.appWindowNav a span')).map(x=>x.textContent.trim())")
            assert labels==['Worker Card','Documents','Jobs','Apps','Settings'],labels
            compact=w.until(EC.presence_of_element_located((By.ID,'workAvailabilityCompact')))
            assert compact.get_attribute('data-state') in ('available','busy','from-date')
            keys=d.execute_async_script("var done=arguments[0];caches.keys().then(done).catch(()=>done([]));")
            assert any(k.startswith('nosmo-work-v10102-canonical') for k in keys),keys

            print('NOSMO_WORK_V1_0102_STORAGE_MIGRATION_QA_PASS')
          finally:
            d.quit()
          PY
