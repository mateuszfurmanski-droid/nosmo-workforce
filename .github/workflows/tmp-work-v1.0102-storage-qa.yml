name: TMP NOSMO Work V1.0102 Storage Migration QA

on:
  push:
    branches:
      - tmp/work-v1.0102-storage-migration
    paths:
      - apps/work/**
      - .github/workflows/tmp-work-v1.0102-storage-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated migration fixtures
        shell: bash
        run: |
          cat > apps/work/storage-seed-fixture.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>seed</title></head><body>seed</body></html>
          EOF
          cat > apps/work/storage-migration-fixture.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><title>migration</title></head><body>migration<script src="./js/work-storage-migration.js?v=10102"></script></body></html>
          EOF
      - name: Start Work server
        shell: bash
        run: |
          python -m http.server 4173 --directory apps/work >/tmp/work-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/storage-seed-fixture.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/work-http.log
          exit 1
      - name: Install selenium
        run: python -m pip install --quiet selenium
      - name: Run storage migration acceptance
        shell: bash
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          base='http://localhost:4173/'
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,15)
          try:
            d.get(base+'storage-seed-fixture.html')
            d.execute_script("localStorage.clear()")
            reset=d.execute_async_script("""
              const done=arguments[0];
              const names=['nosmo-work-files-v1','nosmo-person-card-freeware-files-v1'];
              let left=names.length;
              names.forEach(name=>{
                const req=indexedDB.deleteDatabase(name);
                const finish=()=>{left--;if(left===0)done('OK')};
                req.onsuccess=finish;req.onerror=finish;req.onblocked=finish;
              });
            """)
            assert reset=='OK', reset

            d.execute_script("""
              localStorage.setItem('nosmo-person-card-freeware:documents/v1', JSON.stringify([{id:'legacy-doc-1',name:'Legacy CSCS',type:'cards',expiry:'2027-01-01',source:'local'}]));
              localStorage.setItem('nosmo-person-card-freeware:work-card/v2', JSON.stringify({profile:{currentRole:'Legacy Joiner',availability:'Available now',preferredLocation:'Leeds',employmentType:'CIS / Contract'},recentProjects:[],workHistory:[],references:[],skills:[],licences:[],notes:[]}));
              localStorage.setItem('nosmo-person-card-freeware:jobs/v1', JSON.stringify([{id:'legacy-job-1',role:'Carpenter / Joiner',company:'Legacy Employer',location:'Leeds',constructionOnly:true,status:'NEW'}]));
              localStorage.setItem('nosmo-person-card-freeware:applications/v1', JSON.stringify([{id:'legacy-app-1',jobId:'legacy-job-1',status:'TO APPLY',history:[]} ]));
              localStorage.setItem('nosmo-person-card-freeware:employers/v1', JSON.stringify([{id:'legacy-employer-1',company:'Legacy Agency',location:'Leeds'}]));
              localStorage.setItem('nosmo-person-card-freeware:application-log/v1', JSON.stringify([{id:'legacy-log-1',status:'opened',jobId:'legacy-job-1'}]));
              localStorage.setItem('nosmo-person-card-freeware:file-registry/v1', JSON.stringify([{id:'legacy-file-1',name:'legacy-cv.pdf',fileRole:'cv',storage:'indexeddb-local',size:4,type:'application/pdf',addedAt:new Date().toISOString()}]));
              localStorage.setItem('nosmo-person-card-freeware:contact-draft/v1:worker:legacy-job-1', JSON.stringify({phone:'07123456789',email:'legacy@example.invalid'}));
            """)

            ok=d.execute_async_script("""
              const done=arguments[0];
              const req=indexedDB.open('nosmo-person-card-freeware-files-v1',1);
              req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'})};
              req.onerror=()=>done('ERR:'+String(req.error));
              req.onsuccess=()=>{
                const db=req.result;const tx=db.transaction('files','readwrite');
                tx.objectStore('files').put({id:'legacy-file-1',name:'legacy-cv.pdf',size:4,type:'application/pdf',lastModified:0,addedAt:new Date().toISOString(),fileRole:'cv',blob:new Blob(['test'],{type:'application/pdf'})});
                tx.oncomplete=()=>{db.close();done('OK')};
                tx.onerror=()=>done('ERR:'+String(tx.error));
              };
            """)
            assert ok=='OK', ok

            source=d.execute_async_script("""
              const done=arguments[0];const req=indexedDB.open('nosmo-person-card-freeware-files-v1');
              req.onerror=()=>done(null);
              req.onsuccess=()=>{const db=req.result;const r=db.transaction('files','readonly').objectStore('files').get('legacy-file-1');r.onsuccess=()=>{const v=r.result;db.close();done(v?{id:v.id,name:v.name,size:v.size}:null)};r.onerror=()=>{db.close();done(null)}};
            """)
            assert source and source['id']=='legacy-file-1', source

            d.get(base+'storage-migration-fixture.html')
            w.until(lambda x: x.execute_script("return !!window.NOSMO_WORK_STORAGE_READY"))
            migrated=d.execute_async_script("var done=arguments[0];window.NOSMO_WORK_STORAGE_READY.then(v=>done(v)).catch(e=>done('ERR:'+e.message));")
            assert migrated is True, migrated

            expected={
              'nosmo-work:documents/v1':'legacy-doc-1',
              'nosmo-work:work-card/v2':'Legacy Joiner',
              'nosmo-work:jobs/v1':'legacy-job-1',
              'nosmo-work:applications/v1':'legacy-app-1',
              'nosmo-work:employers/v1':'legacy-employer-1',
              'nosmo-work:application-log/v1':'legacy-log-1',
              'nosmo-work:file-registry/v1':'legacy-file-1',
              'nosmo-work:contact-draft/v1:worker:legacy-job-1':'07123456789',
            }
            for key,needle in expected.items():
              value=d.execute_script("return localStorage.getItem(arguments[0])",key)
              assert value and needle in value,(key,value)

            assert 'Legacy Joiner' in d.execute_script("return localStorage.getItem('nosmo-person-card-freeware:work-card/v2')")
            assert d.execute_script("return !!localStorage.getItem('nosmo-work:migration:person-card-freeware/v1')")
            assert d.execute_script("return !!localStorage.getItem('nosmo-work:migration:indexeddb-files/v1')")

            row=d.execute_async_script("""
              const done=arguments[0];const req=indexedDB.open('nosmo-work-files-v1');
              req.onerror=()=>done(null);
              req.onsuccess=()=>{const db=req.result;if(!db.objectStoreNames.contains('files')){db.close();done(null);return}
                const r=db.transaction('files','readonly').objectStore('files').get('legacy-file-1');
                r.onsuccess=()=>{const v=r.result;db.close();done(v?{id:v.id,name:v.name,size:v.size}:null)};
                r.onerror=()=>{db.close();done(null)};
              };
            """)
            assert row and row['id']=='legacy-file-1' and row['name']=='legacy-cv.pdf',row

            # Use DOM queries by script so service-worker refresh cannot stale Selenium element handles.
            d.get(base+'screen.html?screen=documents')
            w.until(lambda x: x.execute_script("return !!document.getElementById('documentsScreen') && !document.getElementById('documentsScreen').hasAttribute('hidden')"))
            assert 'Legacy CSCS' in d.page_source
            d.get(base+'screen.html?screen=work')
            w.until(lambda x: x.execute_script("return !!document.getElementById('workScreen') && !document.getElementById('workScreen').hasAttribute('hidden')"))
            assert 'Legacy Employer' in d.page_source
            print('NOSMO_WORK_V1_0102_STORAGE_MIGRATION_QA_PASS')
          finally:
            d.quit()
          PY
