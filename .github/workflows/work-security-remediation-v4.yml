name: NOSMO Work Security Remediation V4

on:
  push:
    branches:
      - security/nosmo-security-gate
    paths:
      - .github/workflows/work-security-remediation-v4.yml

permissions:
  contents: write

jobs:
  remediate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/work
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nosmo-security-gate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/work/package-lock.json
      - name: Install current dependency graph
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Upgrade patched Next release
        run: npm install next@16.3.4 --save-exact --ignore-scripts --no-audit --no-fund
      - name: Apply available non-breaking audit remediation
        run: npm audit fix --ignore-scripts --no-fund || true
      - name: Verify production dependency gate
        run: npm audit --omit=dev --audit-level=high
      - name: Verify intended package manifest change
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const before=JSON.parse(execFileSync('git',['show','HEAD:apps/work/package.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(after.dependencies.next!=='16.3.4') throw new Error('Next patch not applied');
          before.dependencies.next='16.3.4';
          if(JSON.stringify(before)!==JSON.stringify(after)) throw new Error('Unexpected package.json change');
          NODE
          mapfile -t changed < <(git diff --name-only -- package.json package-lock.json | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "apps/work/package-lock.json"
          test "${changed[1]}" = "apps/work/package.json"
      - name: Commit remediated dependency graph
        run: |
          git config user.name "NOSMO Security Gate"
          git config user.email "security-gate@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security(worker): patch production dependencies"
          git push origin HEAD:security/nosmo-security-gate
