name: NOSMO Work V1.0102 Browser QA

on:
  push:
    branches:
      - main
    paths:
      - apps/work/**
      - .github/scripts/worker-browser-qa.py
      - .github/workflows/work-v1.0102-browser-qa.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/work/**
      - .github/scripts/worker-browser-qa.py
      - .github/workflows/work-v1.0102-browser-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/work/package-lock.json

      - name: Install canonical Work dependencies
        working-directory: apps/work
        run: npm run install:ci

      - name: Build and run source tests
        working-directory: apps/work
        run: npm test

      - name: Start production Work server
        working-directory: apps/work
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --host 127.0.0.1 --port 4173 >/tmp/nosmo-work.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nosmo-work.log
          exit 1

      - name: Install browser driver
        run: python -m pip install --quiet selenium

      - name: Run responsive acceptance
        run: python .github/scripts/worker-browser-qa.py

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nosmo-work-browser-qa
          path: artifacts/worker-browser-qa
          if-no-files-found: ignore
