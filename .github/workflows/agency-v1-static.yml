name: NOSMO Agency V1 static checks

on:
  push:
    paths:
      - 'apps/agency/**'
      - '.github/workflows/agency-v1-static.yml'
  pull_request:
    paths:
      - 'apps/agency/**'
      - '.github/workflows/agency-v1-static.yml'

permissions:
  contents: read

jobs:
  agency-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check apps/agency/app.js
      - name: Static contract smoke
        run: node apps/agency/tests/static-smoke.mjs
      - name: Protect NOSMO Work boundary
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.before || github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>/dev/null | grep -q '^apps/work/'; then
            echo 'Agency change touched apps/work' >&2
            exit 1
          fi
