<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020713">
<title>NOSMO Work</title>
<style>
:root{--bg:#020713;--panel:#071421;--panel2:#030a14;--line:rgba(108,160,228,.24);--blue:#3a8bff;--blue2:#86bdff;--text:#f5f8ff;--muted:#aeb9ca;--green:#25d77f}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}body{background:radial-gradient(circle at 50% -160px,rgba(58,139,255,.16),transparent 340px),linear-gradient(180deg,#020713,#02060d)}a,button{-webkit-tap-highlight-color:transparent}.page{width:100%;max-width:430px;margin:0 auto;padding:14px 12px 34px}.top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;margin-bottom:12px}.btn{width:44px;height:44px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,rgba(9,24,42,.92),rgba(2,9,18,.94));color:#fff;display:grid;place-items:center;text-decoration:none;font-size:24px}.brand{min-width:0;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden}.brand img:first-child{max-width:min(94px,34vw);max-height:28px;object-fit:contain}.brand img:last-child{max-width:min(108px,40vw);height:28px;object-fit:contain}.rule{width:1px;height:24px;background:linear-gradient(180deg,transparent,rgba(119,181,255,.55),transparent)}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(7,19,33,.9),rgba(2,8,17,.96));box-shadow:0 16px 42px rgba(0,0,0,.36);padding:16px;margin-top:12px}.hero{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center}.photo{width:76px;height:76px;border-radius:50%;border:2px solid rgba(78,148,255,.88);background:#fff url('assets/WorkerCard.jpeg') center 18%/cover no-repeat}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:var(--blue2)}h1{margin:5px 0 0;font-size:24px;line-height:1.02;text-transform:uppercase}.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.35}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:12px}.tab{min-height:48px;border:1px solid var(--line);border-radius:13px;background:rgba(9,26,45,.72);display:grid;place-items:center;text-align:center;color:#eaf3ff;text-decoration:none;font-size:10px;font-weight:850;line-height:1.05}.tab.active{border-color:rgba(58,139,255,.78);background:rgba(58,139,255,.18);color:#fff}.panel h2{margin:0 0 8px;color:var(--blue2);font-size:19px}.panel p{margin:0 0 12px;color:#c7d2e2;font-size:13px;line-height:1.45}.list{display:grid;gap:9px}.row{border:1px solid rgba(108,160,228,.18);border-radius:15px;background:rgba(4,15,28,.72);padding:12px}.row strong{display:block;font-size:14px}.row small{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}.status{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:#b7c6d9;font-size:11px;font-weight:800;text-transform:uppercase}.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions a{min-height:42px;border:1px solid var(--line);border-radius:13px;background:rgba(9,26,45,.8);color:#f7fbff;text-decoration:none;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.footer{padding:16px 0 2px;text-align:center;color:#7fb4ff;font-size:12px}.missing{border-style:dashed;color:#aeb9ca}@media(max-width:360px){.page{padding:12px 9px 30px}.brand{gap:6px}.tabs{gap:5px}.tab{font-size:9px}.actions{grid-template-columns:1fr}.hero{grid-template-columns:68px minmax(0,1fr)}.photo{width:68px;height:68px}h1{font-size:21px}}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/work-v1-final.css?v=1">
<script>(function(){try{var t=localStorage.getItem('nosmo-work:v1:theme');if(!t&&matchMedia('(prefers-color-scheme: light)').matches)t='light';document.documentElement.dataset.workTheme=t||'dark'}catch(_){document.documentElement.dataset.workTheme='dark'}})();</script>
<link rel="stylesheet" href="./css/work-v10101-canonical.css?v=10101">
</head>
<body>
<main class="page">
<header class="top"><a class="btn" href="./index.html" aria-label="Back">‹</a><div class="brand"><img src="https://nosmotechnology.co.uk/assets/nosmo-logo.png" alt="NOSMO"><span class="rule"></span><img src="https://nosmotechnology.co.uk/assets/NEXUS_Logo.png" alt="NEXUS"></div><a class="btn" href="./index.html?previewWork=hub" aria-label="Tree">⌘</a></header>
<button class="nexusAskBar" type="button" data-nosmo-ask-nexus>
  <span class="nexusAskMark">N</span>
  <span class="nexusAskCopy"><strong>Ask Nexus</strong><small>Work, documents, jobs and next actions</small></span>
  <span class="nexusAskArrow">›</span>
</button>
<section class="card hero"><div class="photo"></div><div><div class="eyebrow">Person Card · Worker</div><h1 id="pageTitle">Loading</h1><div class="sub">Technical Advisor · Construction · linked to Nexus Project Graph</div></div></section>
<nav class="tabs" aria-label="Person Card sections"><a class="tab" data-tab="cv" href="./section.html?section=cv">CV</a><a class="tab" data-tab="certs" href="./section.html?section=certs">Certs</a><a class="tab" data-tab="refs" href="./section.html?section=refs">Refs</a><a class="tab" data-tab="availability" href="./section.html?section=availability">Avail.</a><a class="tab" data-tab="vault" href="./section.html?section=vault">Vault</a></nav>
<section class="card panel" id="panel"></section>
<section class="actions"><a href="./index.html">Main card</a><a href="./data-fetcher/">Data/File Loader</a></section>
<div class="footer">NOSMO Nexus · Person Card Layer</div>
</main>
<script>
const sections={
  cv:{title:'My CV',copy:'Worker work profile, employment history and role summary. This is the CV surface that will later export to PDF / Work Pack.',rows:[['Profile summary','Technical Advisor with welding, fabrication and project delivery background.'],['Work history','NOSMO Technology Limited · Custom Marine Projects · Industrial Structures Ltd'],['Export status','PDF export pending. Static frontend placeholder connected to Person Card data.']]},
  certs:{title:'Certificates',copy:'Training, competency and verified records connected to the Person Card.',rows:[['ISO 3834 Welding Coordinator','Training progress: 75% complete.'],['Welding & fabrication records','Verification pending.'],['Nexus verification','Ready for future permissions/audit layer.']]},
  refs:{title:'References',copy:'Professional references and previous project contacts.',rows:[['Reference pack','Pending upload / confirmation.'],['NOSMO contact route','References will be requested and stored through Docs Vault.'],['Privacy state','Private until explicitly shared.']]},
  availability:{title:'Availability',copy:'Work status and project assignment availability.',rows:[['Current status','Available.'],['Location','United Kingdom.'],['Project assignment','Can be linked to project role through Relationship Tree.']]},
  vault:{title:'Docs Vault',copy:'Secure document area for CV, certificates, references and future project evidence.',rows:[['CV','Pending document upload.'],['Certificates','Pending document upload.'],['References','Pending document upload.'],['Nexus File Loader','Use Data/File Loader to attach files to this person context.']]}
};
const params=new URLSearchParams(location.search);const key=sections[params.get('section')]?params.get('section'):'cv';const data=sections[key];document.title=`NOSMO Nexus — Worker ${data.title}`;document.getElementById('pageTitle').textContent=data.title;document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab===key));document.getElementById('panel').innerHTML=`<h2>${data.title}</h2><p>${data.copy}</p><div class="list">${data.rows.map(row=>`<div class="row"><strong>${row[0]}</strong><small>${row[1]}</small><span class="status"><i class="dot"></i>Connected</span></div>`).join('')}</div>`;
</script>
<script src="./js/work-v1-runtime.js?v=1"></script>
<script src="./js/work-v10101-shell.js?v=10101"></script>
</body>
</html>
